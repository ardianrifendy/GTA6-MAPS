<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4096 4096" width="4096" height="4096">
  <defs>
    <!-- Background ocean gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0a1324" />
      <stop offset="100%" stop-color="#070e1c" />
    </linearGradient>

    <!-- Landmass gradient -->
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#0f1728" />
    </linearGradient>

    <!-- Urban glow -->
    <radialGradient id="viceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff007a" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a1324" stop-opacity="0" />
    </radialGradient>

    <!-- Wetlands pattern -->
    <pattern id="marshPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M10,30 Q20,15 30,30 T50,30" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25" />
      <circle cx="25" cy="40" r="3" fill="#10b981" fill-opacity="0.2" />
    </pattern>

    <!-- Grid pattern -->
    <pattern id="gridPattern" width="256" height="256" patternUnits="userSpaceOnUse">
      <path d="M 256 0 L 0 0 0 256" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Ocean Background -->
  <rect width="4096" height="4096" fill="url(#oceanGrad)" />

  <!-- Bathymetry contour depth rings around land -->
  <path d="M 500,400 Q 1500,200 3500,600 Q 3900,1200 3800,2600 Q 3700,3400 2400,3900 Q 1200,3800 600,3100 Q 300,2000 500,400 Z" fill="#091426" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15" />
  <path d="M 650,550 Q 1600,350 3400,750 Q 3750,1300 3650,2500 Q 3550,3250 2400,3750 Q 1300,3650 750,3000 Q 450,1900 650,550 Z" fill="#0c1930" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- MAIN MAINLAND SHORELINE (Leonida State) -->
  <path id="leonida-mainland" d="
    M 800,600
    C 1400,450 2000,500 2600,650
    C 3000,750 3300,1100 3250,1500
    C 3100,1650 2900,1700 2700,1750
    C 2550,1800 2400,1950 2350,2100
    C 2300,2250 2150,2400 1900,2500
    C 1650,2600 1350,2550 1100,2700
    C 900,2820 800,2600 750,2300
    C 700,2000 650,1500 680,1100
    C 700,850 750,700 800,600 Z
  " fill="url(#landGrad)" stroke="#334155" stroke-width="4" />

  <!-- VICE CITY METRO PENINSULA & DOWNTOWN -->
  <path id="vice-metro" d="
    M 2650,1750
    C 2850,1700 3100,1720 3300,1850
    C 3450,1950 3500,2150 3450,2400
    C 3400,2650 3150,2750 2900,2700
    C 2750,2650 2600,2450 2580,2250
    C 2560,2050 2600,1850 2650,1750 Z
  " fill="#17223b" stroke="#475569" stroke-width="3" />

  <!-- OCEAN BEACH BARRIER ISLAND -->
  <path id="ocean-beach-island" d="
    M 3450,1900
    C 3550,1920 3650,2050 3620,2350
    C 3600,2550 3500,2700 3400,2680
    C 3350,2650 3370,2400 3390,2150
    C 3400,2000 3420,1920 3450,1900 Z
  " fill="#1e2c4a" stroke="#ff007a" stroke-width="2" stroke-opacity="0.5" />

  <!-- Ocean Beach Sandy Shoreline -->
  <path d="M 3580,1950 C 3670,2100 3650,2400 3480,2690" fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4" />

  <!-- STARFISH ISLAND -->
  <ellipse cx="3180" cy="2140" rx="90" ry="70" fill="#1b2844" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6" />

  <!-- GRASSRIVERS WETLANDS -->
  <path id="grassrivers" d="
    M 1700,2150
    C 2000,2050 2300,2200 2300,2500
    C 2250,2750 1950,2800 1750,2700
    C 1600,2600 1550,2300 1700,2150 Z
  " fill="url(#marshPattern)" stroke="#10b981" stroke-width="2" stroke-dasharray="8 4" stroke-opacity="0.4" />

  <!-- PORT GELLHORN (West Coast Industrial Port) -->
  <path id="port-gellhorn" d="
    M 950,2450
    C 1150,2400 1300,2500 1280,2700
    C 1250,2850 1050,2900 920,2800
    C 850,2700 880,2550 950,2450 Z
  " fill="#1c2538" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5" />

  <!-- Port Gellhorn Docks Piers -->
  <rect x="1100" y="2580" width="120" height="30" fill="#334155" rx="4" />
  <rect x="1120" y="2640" width="140" height="30" fill="#334155" rx="4" />
  <rect x="1100" y="2700" width="130" height="30" fill="#334155" rx="4" />

  <!-- LEONIDA KEYS ARCHIPELAGO -->
  <!-- Key 1 -->
  <ellipse cx="2650" cy="3050" rx="110" ry="55" transform="rotate(-20 2650 3050)" fill="#18233c" stroke="#475569" stroke-width="2" />
  <!-- Key 2 -->
  <ellipse cx="2450" cy="3280" rx="140" ry="60" transform="rotate(-35 2450 3280)" fill="#18233c" stroke="#475569" stroke-width="2" />
  <!-- Key 3 -->
  <ellipse cx="2200" cy="3500" rx="170" ry="75" transform="rotate(-40 2200 3500)" fill="#18233c" stroke="#475569" stroke-width="2" />
  <!-- Key 4 (South Key) -->
  <ellipse cx="1950" cy="3720" rx="130" ry="60" transform="rotate(-30 1950 3720)" fill="#18233c" stroke="#475569" stroke-width="2" />

  <!-- HIGHWAYS & BRIDGES (Neon Vector Lines) -->
  <!-- Seven Mile Bridge to Keys -->
  <path d="M 2850,2700 L 2650,3050 L 2450,3280 L 2200,3500 L 1950,3720" fill="none" stroke="#00f0ff" stroke-width="5" stroke-dasharray="12 4" stroke-opacity="0.8" />

  <!-- Vice City Causeway East-West -->
  <path d="M 2580,2150 L 3050,2140 L 3180,2140 L 3380,2150 L 3480,2150" fill="none" stroke="#ff007a" stroke-width="5" stroke-opacity="0.85" />

  <!-- Interstate North-South Highway -->
  <path d="
    M 1750,700
    C 1850,1100 2200,1400 2400,1650
    C 2550,1850 2700,2050 2800,2300
    C 2850,2500 2850,2700 2850,2700
  " fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.75" />

  <!-- West Coastal Highway to Port Gellhorn -->
  <path d="
    M 2400,1650
    C 2100,1800 1700,1950 1450,2200
    C 1300,2350 1150,2450 1050,2650
  " fill="none" stroke="#38bdf8" stroke-width="5" stroke-opacity="0.6" />

  <!-- Vice City Glow Effect Overlay -->
  <circle cx="3100" cy="2200" r="600" fill="url(#viceGlow)" />

  <!-- CARTOGRAPHIC GRID & TICKS -->
  <rect width="4096" height="4096" fill="url(#gridPattern)" />

  <!-- Border Frame -->
  <rect x="20" y="20" width="4056" height="4056" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.4" />
  <rect x="36" y="36" width="4024" height="4024" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- TYPOGRAPHY / REGION LABELS -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" letter-spacing="8" opacity="0.6">
    <text x="3000" y="1850" fill="#ff007a" font-size="52">VICE CITY DOWNTOWN</text>
    <text x="3450" y="2450" fill="#00f0ff" font-size="44" transform="rotate(75 3450 2450)">OCEAN BEACH</text>
    <text x="3120" y="2150" fill="#ffffff" font-size="28" letter-spacing="4">STARFISH ISLAND</text>
    <text x="960" y="2650" fill="#00f0ff" font-size="48">PORT GELLHORN</text>
    <text x="1800" y="2400" fill="#10b981" font-size="54">GRASSRIVERS WETLANDS</text>
    <text x="2100" y="3400" fill="#f59e0b" font-size="50">LEONIDA KEYS</text>
    <text x="1400" y="900" fill="#94a3b8" font-size="58">AMBROSIA COUNTY</text>
  </g>

  <!-- CARTOGRAPHIC COMPASS ROSE (Top Right) -->
  <g transform="translate(3750, 350)">
    <circle cx="0" cy="0" r="140" fill="#091322" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.4" />
    <polygon points="0,-120 18,-20 0,0" fill="#ff007a" />
    <polygon points="0,-120 -18,-20 0,0" fill="#f43f5e" />
    <polygon points="0,120 18,20 0,0" fill="#334155" />
    <polygon points="0,120 -18,20 0,0" fill="#475569" />
    <polygon points="120,0 20,18 0,0" fill="#334155" />
    <polygon points="120,0 20,-18 0,0" fill="#475569" />
    <polygon points="-120,0 -20,18 0,0" fill="#334155" />
    <polygon points="-120,0 -20,-18 0,0" fill="#475569" />
    <circle cx="0" cy="0" r="16" fill="#00f0ff" />
    <text x="-12" y="-132" fill="#ff007a" font-size="34" font-weight="900" font-family="sans-serif">N</text>
  </g>

  <!-- OFFICIAL WATERMARK / DISCLAIMER BANNER -->
  <g transform="translate(100, 3960)">
    <rect x="0" y="-50" width="1100" height="60" fill="#060c18" stroke="#334155" stroke-width="1.5" rx="6" />
    <text x="20" y="-14" fill="#94a3b8" font-size="20" font-family="sans-serif" font-weight="700" letter-spacing="2">
      LEONIDA COMPANION MAP — DEV BASEMAP SPEC V1.0 (CRS.SIMPLE 4096×4096)
    </text>
  </g>
</svg>
